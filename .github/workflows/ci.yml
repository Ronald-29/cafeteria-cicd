name: CI/CD - Cafeteria React

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watchAll=false

      - name: Construir aplicacion
        run: npm run build

      - name: Construir imagen Docker
        run: docker build -t cafeteria:${{ github.sha }} .

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:${{ github.sha }}

  deploy:
    name: Desplegar en Kubernetes
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Verificar Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Aplicar manifiestos Kubernetes
        run: |
          kubectl apply -f kubernetes/

      - name: Actualizar imagen
        run: |
          kubectl set image deployment/cafeteria-deployment \
            cafeteria=ronal29/cafeteria:${{ github.sha }}

      - name: Esperar Rolling Update
        run: |
          kubectl rollout status deployment/cafeteria-deployment --timeout=120s

      - name: Verificar despliegue
        run: |
          kubectl get deployment cafeteria-deployment
          kubectl get pods
          kubectl get service cafeteria-service