name: CI - Cafeteria React

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  
jobs:

  # =========================================================
  # CI - INTEGRACIÓN CONTINUA
  # =========================================================
  build:
    name: CI - Construir, probar y publicar
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar código
      - name: Descargar codigo
        uses: actions/checkout@v7

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecutar pruebas
      - name: Ejecutar pruebas
        run: npm test -- --watchAll=false

      # 5. Construir aplicación
      - name: Construir aplicacion
        run: npm run build

      # 6. Login en Docker Hub
      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Construir y publicar imagen
      - name: Construir y publicar imagen Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:${{ github.sha }}

      # 8. Actualizar manifiesto Kubernetes para Argo CD
      - name: Actualizar imagen en manifiesto Kubernetes
        if: github.event_name == 'push'
        run: |
          sed -i \
            "s|image: ronal29/cafeteria:.*|image: ronal29/cafeteria:${{ github.sha }}|" \
            kubernetes/deployment.yaml

          echo "Nueva imagen declarada:"
          grep "image:" kubernetes/deployment.yaml

      # 9. Guardar el nuevo estado deseado en Git
      - name: Actualizar manifiesto GitOps
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "El manifiesto ya contiene la imagen correcta."
            exit 0
          fi

          git commit -m "Actualizar imagen a ${{ github.sha }} [skip ci]"
          git push