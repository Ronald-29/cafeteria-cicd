name: CI/CD - Cafeteria React

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Descargar codigo
        uses: actions/checkout@v7

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecutar pruebas
      - name: Ejecutar pruebas
        run: npm test -- --watchAll=false

      # 5. Construir React
      - name: Construir aplicacion
        run: npm run build

      # 6. Construir imagen Docker para validar el Dockerfile
      - name: Construir imagen Docker
        run: docker build -t cafeteria:${{ github.sha }} .

      # 7. Iniciar sesión en Docker Hub
      # Solo se ejecuta cuando hacemos push a main
      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Construir y publicar la imagen
      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cafeteria:${{ github.sha }}