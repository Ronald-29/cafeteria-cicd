apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-deployment
  namespace: default
  labels:
    app: cafeteria

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cafeteria

  template:
    metadata:
      labels:
        app: cafeteria

    spec:
      containers:
        - name: cafeteria
          image: ronal29/cafeteria:cc553c7c34c1f221313c730f47cabe5a78162f11
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20