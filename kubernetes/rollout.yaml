apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cafeteria-deployment
  namespace: default
  labels:
    app: cafeteria

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cafeteria

  template:
    metadata:
      labels:
        app: cafeteria
    spec:
      containers:
        - name: cafeteria
          image: ronal29/cafeteria:f19568987d8a634ac7a8e2ff50456fb1d547f7bb
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 75
        - pause: {}