apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cafeteria-deployment
  namespace: default
  labels:
    app: cafeteria

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cafeteria

  template:
    metadata:
      labels:
        app: cafeteria
    spec:
      containers:
        - name: cafeteria
          image: ronal29/cafeteria:fad8c3cce1fc091a1d0eecb256859f5f10625367
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

  strategy:
    canary:
      stableService: cafeteria-service
      canaryService: cafeteria-canary-service

      steps:
        - setWeight: 25
        - pause: {}

        - analysis:
            templates:
              - templateName: cafeteria-health-check

        - setWeight: 50
        - pause: {}

        - setWeight: 75
        - pause: {}