apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cafeteria-metrics
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: cafeteria
      component: metrics

  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
